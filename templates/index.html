<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>CineRetriever</title>
</head>
<body>
    <h1>CineRetriever</h1>
    
    <div class="search-container">
        <input type="text" id="queryInput" placeholder="Describe a movie scene, mood, or setup..." onkeypress="handleKeyPress(event)">
        <button onclick="performSearch()">Search</button>
    </div>
    
    <div id="stats" style="text-align: center; margin-bottom: 20px; color: #888;"></div>

    <div id="resultsGrid" class="results-grid">
        <!-- Results will be injected here via JavaScript -->
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
