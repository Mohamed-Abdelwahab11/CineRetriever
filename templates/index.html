<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRetriever | AI-Powered Movie Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">Cine<span>Retriever</span></h1>
            <p class="tagline">Advanced Information Retrieval System • DSAI 201</p>
        </header>

        <div class="search-area">
            <div class="search-bar">
                <input type="text" id="queryInput" placeholder="Describe a movie scene, mood, or plot..." onkeypress="handleKeyPress(event)">
                <button onclick="performSearch()">Search</button>
            </div>
            <div id="stats" class="search-stats"></div>
        </div>

        <main id="resultsGrid" class="results-grid">
            <!-- Dynamic result cards injected here -->
            <div class="placeholder-text">Enter a query to begin searching the cinematic archive.</div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
